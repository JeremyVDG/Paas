<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tragaperras</title>
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .slot-machine {
      background: #333;
      border: 5px solid #888;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px #000;
    }

    .reels {
      display: flex;
      justify-content: center;
      font-size: 3rem;
      margin: 20px 0;
    }

    .reel {
      background: #000;
      border: 2px solid #fff;
      border-radius: 10px;
      width: 70px;
      height: 70px;
      margin: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1.2rem;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .credits {
      margin-top: 15px;
      font-size: 1.2rem;
    }

    .message {
      margin-top: 10px;
      font-size: 1rem;
      height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="slot-machine">
    <h1>🎰 Tragaperras</h1>
    <div class="reels">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍋</div>
      <div class="reel" id="reel3">🍊</div>
    </div>
    <button id="spinBtn">Girar (Coste: 1 crédito)</button>
    <div class="credits">Créditos: <span id="credits">10</span></div>
    <div class="message" id="message"></div>
  </div>

  <script>
    const symbols = ['🍒', '🍋', '🍊', '🍉', '🔔', '⭐', '7️⃣'];
    const reelElements = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3'),
    ];
    const creditsDisplay = document.getElementById('credits');
    const messageDisplay = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');

    let credits = 10;

    function updateCredits(amount) {
      credits += amount;
      creditsDisplay.textContent = credits;
      spinBtn.disabled = credits <= 0;
    }

    function spin() {
      if (credits <= 0) return;

      updateCredits(-1);
      messageDisplay.textContent = '';

      const result = reelElements.map(reel => {
        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
        reel.textContent = symbol;
        return symbol;
      });

      if (result[0] === result[1] && result[1] === result[2]) {
        messageDisplay.textContent = '¡Jackpot! +5 créditos 🎉';
        updateCredits(5);
      } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
        messageDisplay.textContent = '¡Coincidencia parcial! +2 créditos 🍀';
        updateCredits(2);
      } else {
        messageDisplay.textContent = 'Sigue intentando...';
      }
    }

    spinBtn.addEventListener('click', spin);
  </script>
</body>
</html>
